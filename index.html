<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shield,rss_feed,description,vital_signs,travel,bolt" />
</head>

<body>
    <header>
        <span class="material-symbols-outlined">shield</span>
        <p>SIGINT OPS</p>
        <button class="btn">• SECURE • ONLINE</button>
    </header>

    <main>
        <div class="container_r">
            <div class='radar'>
                <div class='sweep'></div>
                <span class="dot d1"></span>
                <span class="dot d2"></span>
                <span class="dot d3"></span>
            </div>
        </div>

        <div class="text_counter">
            <h2>24</h2>
            <p>ACTIVE SIGNALS</p>
            <h2>07</h2>
            <p>PRIORITY ALERTS</p>
        </div>
    </main>
    
    
    
    <section class="buttons">
        <button class="b1">
            <span class="material-symbols-outlined">bolt</span>New Brief
        </button>
        <button class="b2">
            <span><></span>Decode
        </button>
        <button class="b3">
            <span class="material-symbols-outlined">travel</span>Request Drone
        </button>
    </section>
    
    
    
    
    <section class="cards">
        <div class="card1"></div>
        <div class="card2"></div>
        <div class="card3"></div>
        <div class="card4"></div>
    </section>
    
    
    
    
    <!-- שורת אזהרה -->
        <div class="threat">
            <span class="threat-dot"></span>
            <span class="threat-text">THREAT DETECTED</span>
        </div>
    
        <footer>
        <div class="footer_center">
        <div class="footer_items">
            <span class="material-symbols-outlined">vital_signs</span>
            <span>Dashboard</span>
        </div>

        <div class="footer_items">
            <span class="material-symbols-outlined">rss_feed</span>
            <span>Feed</span>
        </div>

        <div class="footer_items">
            <span class="material-symbols-outlined">description</span>
            <span>Brief</span>
        </div>
        </div>

        <!-- סימן שאלה בצד -->
        <div class="footer_right">
            <span class="Search">?</span>
        </div>
    </footer>

</body>

</html>
